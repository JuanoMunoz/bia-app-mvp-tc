services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bia
      POSTGRES_PASSWORD: bia
      POSTGRES_DB: energydb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bia -d energydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://bia:bia@db:5432/energydb?sslmode=disable
      PORT: "8080"
      MIGRATIONS_SQL: migrations
    working_dir: /app/backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://bia:bia@db:5432/energydb?sslmode=disable
      MIGRATIONS_SQL: migrations
    working_dir: /app/backend
    command: ["./seed"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
